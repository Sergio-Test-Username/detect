name: App
options:
  bundleIdPrefix: ai.mobilecode
  deploymentTarget:
    iOS: "17.0"
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.mobilecode.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LensGuard
        INFOPLIST_KEY_NSCameraUsageDescription: "LensGuard uses the camera to spot lens reflections and infrared light from hidden cameras."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "LensGuard scans for nearby Bluetooth devices that may be hidden cameras."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "LensGuard scans your Wi-Fi network for IP cameras and streaming devices."
        INFOPLIST_KEY_NSMotionUsageDescription: "LensGuard reads the magnetometer to find electronics hidden nearby."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"